<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Cybernetic Grid</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-family: 'Courier New', monospace; pointer-events: none; }
    </style>
    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
    <div id="ui"><h1>CYBERNETIC GRID</h1><p>سیستم شبکه سه‌بعدی متحرک</p></div>
    <script type="module">
        import * as THREE from 'three';
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        const grid = new THREE.GridHelper(100, 50, 0x00ffcc, 0x222222);
        scene.add(grid);

        const geometry = new THREE.SphereGeometry(0.5, 16, 16);
        const material = new THREE.MeshBasicMaterial({color: 0x00ffcc});
        const nodes = [];
        for(let i=0; i<20; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set((Math.random()-0.5)*50, 0, (Math.random()-0.5)*50);
            scene.add(mesh);
            nodes.push(mesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            nodes.forEach((n, i) => {
                n.position.y = Math.sin(Date.now()*0.002 + i) * 2;
            });
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
